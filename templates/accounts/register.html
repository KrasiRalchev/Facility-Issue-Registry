<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow-lg border-0 rounded-lg overflow-hidden register-card">

                <div class="card-header text-center bg-gradient-primary text-white py-4">
                    <h4 class="mb-1 fw-bold tracking-wide">Create Account</h4>
                    <p class="mb-0 text-white-50 small" style="font-size: 1.2rem;">Facility ussie registry</p>
                </div>

                <div class="card-body p-4">
                    <form method="post" class="register-form">
                        {% csrf_token %}

                        {% for field in form %}

                       <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase text-secondary small" for="{{ field.id_for_label }}" style="letter-spacing: 0.5px; font-size: 0.75rem;">
                                {{ field.label }}
                            </label>
                            <div class="input-group-custom">
                                {{ field }}
                            </div>
                            {% if field.errors %}
                                <div class="text-danger small mt-1 ps-1" style="font-size: 0.75rem;">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <div class="d-grid mt-4">

                            <button type="submit" class="btn btn-gradient-primary rounded-pill shadow-sm fw-bold tracking-wider text-uppercase" style="font-size: 0.9rem;">
                                Register
                            </button>
                        </div>
                    </form>
                </div>
             <div class="card-footer d-flex justify-content-center align-items-center bg-white py-3 border-0 w-100">
                    <small class="text-muted" style="font-size: 0.85rem;">
                        <a href="{% url 'accounts:login'%} " class="text-primary fw-bold text-decoration-none ms-1">Back to login</a>
                    </small>
                </div>

            </div>

        </div>
    </div>
</div>

<style>

body {
    background-color: #f8f9fa;
}

.register-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.register-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,.1)!important;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.bg-gradient-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.btn-gradient-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    transition: all 0.3s ease;
    padding: 0.6rem 1rem; /* Smaller padding for button */
}

.btn-gradient-primary:hover {
    background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(118, 75, 162, 0.3);
}

.btn-gradient-primary:active {
    transform: translateY(0);
}


.register-form input,
.register-form select,
.register-form textarea {
    display: block;
    width: 100%;
    /* Reduced padding for inputs */
    padding: 0.5rem 0.75rem;
    font-size: 0.9rem; /* Smaller font size */
    line-height: 1.5;
    color: #495057;
    background-color: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 0.4rem; /* Slightly smaller radius */
    transition: all 0.2s ease-in-out;
}

.register-form input:focus,
.register-form select:focus,
.register-form textarea:focus {
    color: #495057;
    background-color: #fff;
    border-color: #764ba2;
    outline: 0;
    box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.2);
}

.tracking-wide {
    letter-spacing: 0.05em;
}

.tracking-wider {
    letter-spacing: 0.1em;
}

</style>

</body>

</html>
